<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        function addRow(){
            var table = document.querySelector("table")

            var row = document.createElement('tr')

            row.innerHTML=`<td> <input type="text" value ="Enter Skills"></td> 
           <td> <input type="text" value ="Month"></td>
            <td>
                <select>
                    <option value="Yes"> Yes</option>
                    <option value="No"> No</option>

                </select>
            </td> `

            table.appendChild(row)
        }

    </script>
    

</head>
<body>
    <h3>Add your skills</h3>
    <table>
        <tr>
            <th>skills</th>
            <th>month taken</th>
            <th>Certified?</th>
        </tr>
        <tr>
           <td> <input type="text" value ="Enter Skills"></td> 
           <td> <input type="text" value ="Month"></td>
            <td>
                <select>
                    <option value="Yes"> Yes</option>
                    <option value="No"> No</option>

                </select>
            </td> 
        </tr>
       

    </table>
     <button type="button" onclick="addRow()"> Add row</button>
   
    
</body>
</html>
